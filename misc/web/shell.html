<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="screen-orientation" content="landscape">
		<meta name="apple-mobile-web-app-orientation" content="landscape">
		<meta name="theme-color" content="#1a1f1c">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	height: 100dvh;
	overflow: hidden;
	position: fixed;
	inset: 0;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	/* Fond sombre = pas de bandeau vert sous le splash / canvas */
	background-color: #1a1f1c;
	color: white;
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	outline: none;
	/* Pas de pixelated : rendu farm 2D soft (le buffer DPR garde la netteté). */
	image-rendering: auto;
}

#canvas:focus {
	outline: none;
}

/* Probe invisible pour lire env(safe-area-inset-*) depuis Godot */
#cei-safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding-left: env(safe-area-inset-left, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-top: env(safe-area-inset-top, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
}

#status {
	position: absolute;
	inset: 0;
	z-index: 10;
	background: #1a1f1c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: visible;
	gap: 0;
}

#status-brand {
	position: relative;
	width: min(78vw, 380px);
	height: min(58vh, 340px);
	text-align: center;
}

#status-header {
	position: absolute;
	left: 50%;
	top: calc(50% - min(20vh, 100px) - 72px);
	transform: translateX(-50%);
	display: flex;
	flex-direction: column;
	align-items: center;
	width: 100%;
	z-index: 2;
	pointer-events: none;
}

#status-title {
	margin: 0;
	font-family: "Lilita One", "Segoe UI Black", Impact, system-ui, sans-serif;
	font-size: clamp(32px, 6.5vw, 52px);
	font-weight: 400;
	line-height: 1.1;
	color: #ffe138;
	letter-spacing: 0.02em;
	text-shadow:
		0 0 2px rgba(40, 24, 0, 0.95),
		0 3px 0 rgba(40, 24, 0, 0.85),
		0 6px 14px rgba(0, 0, 0, 0.4);
	white-space: nowrap;
}

#truck-stage {
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	width: min(68vw, 340px);
	height: min(40vh, 200px);
	overflow: visible;
	z-index: 1;
}

#status-footer {
	position: absolute;
	left: 50%;
	top: calc(50% + min(20vh, 100px) + 14px);
	transform: translateX(-50%);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 6px;
	width: 100%;
	z-index: 2;
	pointer-events: none;
}

@keyframes truck-roll {
	0%, 100% { transform: translateY(0) rotate(0deg); }
	25% { transform: translateY(-1.5px) rotate(0.3deg); }
	50% { transform: translateY(-2.5px) rotate(0deg); }
	75% { transform: translateY(-1.5px) rotate(-0.3deg); }
}

@keyframes dust-drift {
	0%   { opacity: 0; transform: translate(0, 0) scale(0.55); }
	18%  { opacity: 0.5; }
	100% { opacity: 0; transform: translate(-36px, -10px) scale(1.45); }
}

@keyframes shadow-breathe {
	0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.32; }
	50% { transform: translateX(-50%) scaleX(0.94); opacity: 0.2; }
}

@keyframes dots-blink {
	0%, 20% { content: ""; }
	40% { content: "."; }
	60% { content: ".."; }
	80%, 100% { content: "..."; }
}

.truck-wrap {
	position: absolute;
	inset: 0 0 12px 0;
	z-index: 1;
	animation: truck-roll 0.55s ease-in-out infinite;
	transform-origin: 50% 75%;
}

#status-splash {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: contain;
	filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
	pointer-events: none;
}

#status-splash.show-image--false {
	display: none;
}

.truck-shadow {
	position: absolute;
	left: 50%;
	bottom: 2px;
	width: 42%;
	height: 10px;
	border-radius: 50%;
	background: radial-gradient(ellipse, rgba(0, 0, 0, 0.45) 0%, transparent 70%);
	transform: translateX(-50%);
	animation: shadow-breathe 0.55s ease-in-out infinite;
	pointer-events: none;
	z-index: 0;
}

.dust-layer {
	position: absolute;
	inset: 0;
	pointer-events: none;
	z-index: 0;
	overflow: visible;
}

.dust-puff {
	position: absolute;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(200, 180, 140, 0.55) 0%, rgba(200, 180, 140, 0) 70%);
	filter: blur(1px);
	animation: dust-drift 0.85s ease-out infinite;
	pointer-events: none;
}

.dust-puff.d1 { width: 20px; height: 14px; left: 22%; bottom: 16%; animation-delay: 0s; }
.dust-puff.d2 { width: 16px; height: 11px; left: 28%; bottom: 20%; animation-delay: 0.28s; }
.dust-puff.d3 { width: 22px; height: 15px; left: 54%; bottom: 15%; animation-delay: 0.14s; }
.dust-puff.d4 { width: 14px; height: 10px; left: 58%; bottom: 22%; animation-delay: 0.42s; }

#status-msg {
	display: none;
}

#status-bar-wrap {
	width: min(70vw, 260px);
	height: 4px;
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.08);
	overflow: hidden;
}

#status-bar {
	height: 100%;
	width: 2%;
	border-radius: inherit;
	background: #8cb884;
	transition: none;
}

#status-pct {
	font: 500 12px/1 system-ui, -apple-system, Segoe UI, sans-serif;
	color: rgba(178, 194, 164, 0.9);
	letter-spacing: 0.02em;
}

#status-progress {
	display: none !important;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: system-ui, sans-serif;
	line-height: 1.3;
	margin: 1rem 2rem 0;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
	max-width: min(92vw, 420px);
}

#mobile-tip {
	display: none;
	position: fixed;
	left: 50%;
	bottom: max(12px, env(safe-area-inset-bottom, 0px));
	transform: translateX(-50%);
	z-index: 20;
	max-width: min(92vw, 420px);
	padding: 10px 14px;
	border-radius: 12px;
	background: rgba(20, 28, 22, 0.92);
	color: #f2f5ef;
	font: 600 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif;
	text-align: center;
	box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
	pointer-events: auto;
}

#mobile-tip button {
	margin-top: 8px;
	border: 0;
	border-radius: 8px;
	padding: 8px 12px;
	background: #3d4a42;
	color: #fff;
	font: 700 13px/1 system-ui, sans-serif;
}

/* Shell = toujours paysage logique (tourné si téléphone vertical). #cei-game = zone jeu. */
#cei-shell {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	height: 100dvh;
	overflow: hidden;
	background: #1a1f1c;
	/* Pas de rotate sur le shell : il reste plein écran (évite bande noire hors stage). */
	transform: none;
}

#cei-game {
	position: absolute;
	overflow: hidden;
	background: #1a1f1c;
	transform-origin: top left;
	/* Couche GPU propre : limite le flou du rotate(90deg) en portrait. */
	-webkit-backface-visibility: hidden;
	backface-visibility: hidden;
	-webkit-transform: translateZ(0);
	transform: translateZ(0);
}

#cei-game #canvas,
#cei-game #status {
	position: absolute;
	inset: 0;
	width: 100% !important;
	height: 100% !important;
}

html.cei-portrait,
body.cei-portrait {
	overflow: hidden;
	background: #1a1f1c;
	width: 100%;
	height: 100%;
	position: fixed;
	inset: 0;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="cei-safe-probe" aria-hidden="true"></div>
		<div id="cei-shell">
		<div id="cei-game">
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-brand">
				<div id="status-header">
					<div id="status-title">Crops Express Idle</div>
				</div>
				<div id="truck-stage" aria-hidden="true">
					<div class="dust-layer">
						<span class="dust-puff d1"></span>
						<span class="dust-puff d2"></span>
						<span class="dust-puff d3"></span>
						<span class="dust-puff d4"></span>
					</div>
					<div class="truck-shadow"></div>
					<div class="truck-wrap">
						<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="loading_logo.png" alt="Crops Express Idle" onerror="this.onerror=null;this.src='$GODOT_SPLASH';">
					</div>
				</div>
				<div id="status-footer">
					<div id="status-bar-wrap" aria-hidden="true"><div id="status-bar"></div></div>
					<div id="status-pct">0 %</div>
				</div>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		</div>

		<div id="mobile-tip" role="dialog" aria-live="polite">
			Pour un vrai plein écran (sans barre d’URL) : ajoute le jeu à l’écran d’accueil.
			<button type="button" id="mobile-tip-dismiss">OK</button>
		</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
/* Adaptive(=2) suit window.inner* (portrait) alors que le CSS est tourné → stretch. */
const CEI_SW_FILE = (GODOT_CONFIG && GODOT_CONFIG.serviceWorker)
	? String(GODOT_CONFIG.serviceWorker)
	: 'crops_express_idle.service.worker.js';
if (GODOT_CONFIG && typeof GODOT_CONFIG === 'object') {
	GODOT_CONFIG.canvasResizePolicy = 0;
	/*
	 * On enregistre le SW nous-mêmes (avec ?cei= + updateViaCache:none).
	 * Si Godot réenregistre le même fichier SANS query string après startGame,
	 * le navigateur voit 2 scriptURL → activate en boucle → reload infini.
	 */
	GODOT_CONFIG.serviceWorker = '';
}
const engine = new Engine(GODOT_CONFIG);

/** Pads déjà appliqués en bandes noires autour de #cei-game (px CSS logiques). */
window.ceiLayoutPads = { l: 0, t: 0, r: 0, b: 0 };

/** Taille logique paysage courante (toujours w ≥ h). */
window.ceiLandscapeSize = { w: 1, h: 1 };

/** Métadonnées layout pour remap des clics (portrait CSS-rotaté → coords paysage). */
window.ceiLayoutMeta = {
	needsRotate: false,
	physW: 1,
	physH: 1,
	ox: 0,
	oy: 0,
	boxX: 0,
	boxY: 0,
	gameW: 1,
	gameH: 1,
};

/**
 * Convertit clientX/Y (écran) → coords buffer canvas Godot (espace paysage).
 * Indispensable en portrait : getBoundingClientRect AABB ne gère pas rotate(90deg).
 */
window.ceiScreenToCanvas = function (clientX, clientY) {
	const canvas = document.getElementById('canvas');
	const meta = window.ceiLayoutMeta;
	if (!canvas || !meta) return null;
	const shell = document.getElementById('cei-shell') || document.body;
	const shellRect = shell.getBoundingClientRect();
	const sx = clientX - shellRect.left;
	const sy = clientY - shellRect.top;
	let lx;
	let ly;
	if (meta.needsRotate) {
		/* Inverse de : translate(physW,0) rotate(90deg) translate(ox,oy)
		 * sx = physW - ly - oy ; sy = lx + ox */
		lx = sy - meta.ox;
		ly = meta.physW - meta.oy - sx;
	} else {
		lx = sx - meta.boxX;
		ly = sy - meta.boxY;
	}
	const gw = Math.max(1, meta.gameW);
	const gh = Math.max(1, meta.gameH);
	return [lx * (canvas.width / gw), ly * (canvas.height / gh)];
};

/** Insets restants DANS le cadre jeu — toujours en coords paysage (pas de remap portrait). */
window.ceiSafeInsets = function () {
	const game = document.getElementById('cei-game') || document.getElementById('cei-shell');
	const gameW = game ? (game.clientWidth || window.ceiLandscapeSize.w || 1) : 1;
	const gameH = game ? (game.clientHeight || window.ceiLandscapeSize.h || 1) : 1;
	/* Bandes noires déjà appliquées en CSS → Godot n'ajoute rien. */
	return { l: 0, t: 0, r: 0, b: 0, w: gameW, h: gameH };
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusBar = document.getElementById('status-bar');
	const statusPct = document.getElementById('status-pct');
	const tip = document.getElementById('mobile-tip');
	const tipBtn = document.getElementById('mobile-tip-dismiss');

	let initializing = true;
	let statusMode = '';
	let displayPct = 0;
	let enginePct = 0;
	let loadDone = false;
	const loadStartedAt = performance.now();
	/* Stampé par tools/patch_web_sw.py à chaque export / deploy. */
	const CEI_DEPLOY_ID = 'dev';
	/* Incrémenter pour forcer un hard-refresh PWA après un fix shell layout. */
	const CEI_LAYOUT_VER = 'portrait-input-v7';
	const EXPECT_MS = 4500;
	const LOAD_WATCHDOG_MS = 45000;
	const BUILD_ID = String(CEI_DEPLOY_ID) + '|' + CEI_LAYOUT_VER + '|' + JSON.stringify((GODOT_CONFIG && GODOT_CONFIG.fileSizes) || {});
	let ceiRefreshing = false;

	/** Purge SW + Cache Storage puis recharge (anti-boucle par cible). */
	async function ceiHardRefresh(reason, toId) {
		if (ceiRefreshing) return true;
		const target = String(toId || CEI_DEPLOY_ID || reason || 'x');
		const guardKey = 'cei_hr_' + target;
		console.warn('[CEI] Hard refresh:', reason, '→', target);
		try {
			if (sessionStorage.getItem(guardKey) === '1') {
				/* Déjà tenté pour cette cible dans cet onglet — évite une boucle. */
				return false;
			}
			sessionStorage.setItem(guardKey, '1');
		} catch (e0) { /* private mode */ }
		ceiRefreshing = true;
		try {
			if ('serviceWorker' in navigator) {
				const regs = await navigator.serviceWorker.getRegistrations();
				await Promise.all(regs.map((r) => r.unregister()));
			}
			if (window.caches && caches.keys) {
				const keys = await caches.keys();
				await Promise.all(keys.map((k) => caches.delete(k)));
			}
		} catch (e) {
			console.warn('[CEI] Hard refresh cleanup failed', e);
		}
		const url = new URL(window.location.href);
		url.searchParams.set('cei_cb', String(Date.now()));
		url.searchParams.set('cei_v', target.slice(0, 24));
		window.location.replace(url.toString());
		return true;
	}

	/** Nouveau BUILD_ID local (HTML) vs dernier connu → purge. */
	async function ceiCheckBuildDrift() {
		try {
			const prev = localStorage.getItem('cei_build_id') || '';
			if (prev && prev !== BUILD_ID) {
				localStorage.setItem('cei_build_id', BUILD_ID);
				return ceiHardRefresh('build_id_changed', CEI_DEPLOY_ID);
			}
			localStorage.setItem('cei_build_id', BUILD_ID);
		} catch (e) { /* private mode */ }
		return false;
	}

	/**
	 * Sonde réseau (cei-version.json, no-store) — marche même si le SW HTML est vieux,
	 * tant que le fetch n’est pas servi depuis le Cache API.
	 */
	async function ceiProbeRemoteVersion() {
		try {
			const url = new URL('cei-version.json', window.location.href);
			url.searchParams.set('t', String(Date.now()));
			const res = await fetch(url.toString(), {
				cache: 'no-store',
				credentials: 'same-origin',
				headers: { 'Cache-Control': 'no-cache' },
			});
			if (!res.ok) return false;
			const data = await res.json();
			const remote = String((data && (data.deploy_id || data.id)) || '');
			if (remote && remote !== String(CEI_DEPLOY_ID)) {
				console.warn('[CEI] Version drift remote=', remote, 'local=', CEI_DEPLOY_ID);
				return ceiHardRefresh('remote_version_drift', remote);
			}
		} catch (e) {
			console.warn('[CEI] version probe failed', e);
		}
		return false;
	}

	/** Ré-enregistre le SW avec ?cei= + updateViaCache:none (crucial iOS). */
	async function ceiReregisterServiceWorker() {
		if (!('serviceWorker' in navigator)) return null;
		const swFile = CEI_SW_FILE;
		const swUrl = swFile + (swFile.indexOf('?') >= 0 ? '&' : '?')
			+ 'cei=' + encodeURIComponent(String(CEI_DEPLOY_ID));
		try {
			const reg = await navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' });
			try { await reg.update(); } catch (e1) {}
			return reg;
		} catch (e) {
			console.warn('[CEI] SW re-register failed', e);
			return null;
		}
	}

	/** Active un nouveau SW sans relancer le chargement en boucle. */
	function ceiWatchServiceWorker() {
		if (!('serviceWorker' in navigator)) return;
		let reloading = false;
		function reloadOnce(reason) {
			if (reloading || ceiRefreshing) return;
			/* Un seul reload auto par deploy dans cet onglet (anti-boucle PWA). */
			const key = 'cei_cc_' + String(CEI_DEPLOY_ID);
			try {
				if (sessionStorage.getItem(key) === '1') {
					console.warn('[CEI] Skip reload (already did for deploy)', reason);
					return;
				}
				sessionStorage.setItem(key, '1');
			} catch (e0) { /* private mode */ }
			reloading = true;
			console.warn('[CEI] Reload once:', reason);
			window.location.reload();
		}
		navigator.serviceWorker.addEventListener('controllerchange', function () {
			reloadOnce('controllerchange');
		});
		navigator.serviceWorker.addEventListener('message', function (ev) {
			const d = ev && ev.data ? ev.data : null;
			if (!d || d.type !== 'cei-reload') return;
			const remote = String(d.v || '');
			/* Même version = déjà à jour : ne pas recharger (sinon boucle activate). */
			if (remote && remote !== String(CEI_DEPLOY_ID)) {
				ceiHardRefresh('sw_message', remote);
			}
		});
		function kick(reg) {
			if (!reg) return;
			if (reg.waiting) {
				try { reg.waiting.postMessage('claim'); } catch (e1) {}
			}
			if (reg.installing) {
				reg.installing.addEventListener('statechange', function () {
					if (reg.waiting) {
						try { reg.waiting.postMessage('claim'); } catch (e3) {}
					}
				});
			}
		}
		function refreshTick() {
			ceiProbeRemoteVersion();
			ceiReregisterServiceWorker().then(kick).catch(function () {});
		}
		navigator.serviceWorker.ready.then(kick).catch(function () {});
		refreshTick();
		document.addEventListener('visibilitychange', function () {
			if (!document.hidden) refreshTick();
		});
		window.addEventListener('focus', refreshTick);
		setInterval(refreshTick, 60000);
	}

	ceiWatchServiceWorker();

	function targetPct() {
		if (loadDone) return 1;
		const elapsed = (performance.now() - loadStartedAt) / 1000;
		const timePct = (1 - Math.exp(-elapsed / (EXPECT_MS / 1000 * 0.55))) * 0.9;
		return Math.max(timePct, Math.min(0.92, enginePct));
	}

	function tickProgress(now) {
		if (!initializing) return;
		const target = targetPct();
		const speed = loadDone ? 0.012 : 0.006;
		displayPct += (target - displayPct) * Math.min(1, speed * 16);
		if (statusBar) statusBar.style.width = (Math.max(0.02, displayPct) * 100) + '%';
		if (statusPct) statusPct.textContent = Math.round(displayPct * 100) + ' %';
		requestAnimationFrame(tickProgress);
	}
	requestAnimationFrame(tickProgress);

	function setLoadProgress(current, total) {
		if (current > 0 && total > 0) {
			enginePct = Math.max(enginePct, current / total);
		}
	}

	function lockLandscape() {
		const o = screen.orientation || screen.mozOrientation || screen.msOrientation;
		if (o && typeof o.lock === 'function') {
			o.lock('landscape').catch(function () { /* iOS / permission */ });
		} else if (typeof screen.lockOrientation === 'function') {
			try { screen.lockOrientation('landscape'); } catch (e) {}
		} else if (typeof screen.mozLockOrientation === 'function') {
			try { screen.mozLockOrientation('landscape'); } catch (e) {}
		}
	}

	function readSafeInsets() {
		const probe = document.getElementById('cei-safe-probe');
		const s = probe ? getComputedStyle(probe) : null;
		return {
			l: s ? (parseFloat(s.paddingLeft) || 0) : 0,
			t: s ? (parseFloat(s.paddingTop) || 0) : 0,
			r: s ? (parseFloat(s.paddingRight) || 0) : 0,
			b: s ? (parseFloat(s.paddingBottom) || 0) : 0,
		};
	}

	/**
	 * Boîte physique à couvrir. On prend le max des mesures (vv / inner / client)
	 * pour éviter la bande noire sous un visualViewport trop petit (Safari iOS).
	 */
	function physicalViewportSize() {
		const vv = window.visualViewport;
		const vvW = vv ? vv.width : 0;
		const vvH = vv ? vv.height : 0;
		const iw = window.innerWidth || 0;
		const ih = window.innerHeight || 0;
		const cw = document.documentElement.clientWidth || 0;
		const ch = document.documentElement.clientHeight || 0;
		return {
			w: Math.max(1, Math.round(Math.max(vvW, iw, cw))),
			h: Math.max(1, Math.round(Math.max(vvH, ih, ch))),
			offsetX: vv ? Math.round(vv.offsetLeft || 0) : 0,
			offsetY: vv ? Math.round(vv.offsetTop || 0) : 0,
		};
	}

	function isMobileViewport() {
		const ua = navigator.userAgent || '';
		if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true;
		try {
			return (navigator.maxTouchPoints > 0)
				&& window.matchMedia('(pointer: coarse)').matches
				&& Math.min(screen.width || 0, screen.height || 0) <= 920;
		} catch (e) {
			return false;
		}
	}

	/**
	 * Toujours du paysage : long côté = largeur, court = hauteur.
	 * On ignore l'orientation téléphone pour les mesures du jeu.
	 */
	function landscapeMetrics() {
		const phys = physicalViewportSize();
		const needsRotate = phys.h > phys.w;
		const logicW = Math.max(phys.w, phys.h);
		const logicH = Math.min(phys.w, phys.h);
		return {
			physW: phys.w,
			physH: phys.h,
			logicW: logicW,
			logicH: logicH,
			needsRotate: needsRotate,
			offsetX: phys.offsetX,
			offsetY: phys.offsetY,
		};
	}

	/**
	 * Bandes seulement sur les bords gauche/droite du jeu paysage.
	 * Portrait + rotate(90deg) CW (y vers le bas) :
	 *   gauche logique → haut physique (notch) ; droite logique → bas physique (home).
	 * Le bas ne doit PAS être plus large que les bandes latérales du vrai paysage :
	 * on prend le même « comfort » (minSide) et on n’ajoute que l’éventuel extra safe-area.
	 */
	function fitLandscapeGame(logicW, logicH, needsRotate, safeOverrides) {
		const mobile = isMobileViewport();
		const minSide = mobile ? 28 : 0;
		const maxPadX = Math.max(0, Math.floor((logicW - 320) * 0.5));
		const safe = safeOverrides || readSafeInsets();

		let padL;
		let padR;
		if (needsRotate) {
			/*
			 * Objectif : mêmes bandes ~28 px qu’en paysage sur les côtés.
			 * - Bas : strictement minSide (safe.b en bande noire était trop large ;
			 *   le home indicator reste un overlay semi-transparent).
			 * - Haut : notch plafonné pour ne pas créer une grosse barre.
			 */
			padL = Math.min(maxPadX, Math.max(minSide, Math.min(safe.t || 0, 34)));
			padR = Math.min(maxPadX, minSide);
		} else {
			padL = Math.min(maxPadX, Math.max(safe.l, minSide));
			padR = Math.min(maxPadX, Math.max(safe.r, minSide));
		}

		const x = Math.round(padL);
		const y = 0;
		const w = Math.max(1, Math.round(logicW - padL - padR));
		const h = Math.max(1, Math.round(logicH));
		return {
			x: x,
			y: y,
			w: w,
			h: h,
			pads: { l: x, t: 0, r: Math.round(padR), b: 0 },
		};
	}

	function canvasDpr() {
		return Math.max(1, Math.min(Number(window.devicePixelRatio) || 1, 3));
	}

	/**
	 * Buffer canvas = CSS × DPR (comme Adaptive Godot).
	 * Sans ça le navigateur upscale un framebuffer 1× → flou rétina.
	 */
	function sizeGameCanvas(canvas, w, h) {
		if (!canvas) return;
		const cssW = Math.max(1, Math.round(w));
		const cssH = Math.max(1, Math.round(h));
		const dpr = canvasDpr();
		const bufW = Math.max(1, Math.round(cssW * dpr));
		const bufH = Math.max(1, Math.round(cssH * dpr));
		/* CSS size via parent 100% ; on force aussi en inline (sans !important). */
		if (canvas.width !== bufW) canvas.width = bufW;
		if (canvas.height !== bufH) canvas.height = bufH;
		window.ceiCanvasBuffer = { w: bufW, h: bufH, cssW: cssW, cssH: cssH, dpr: dpr };
	}

	/** Jeu toujours horizontal. Shell plein écran ; c’est #cei-game qui tourne en portrait. */
	function applyForcedLandscapeLayout() {
		const shell = document.getElementById('cei-shell');
		const game = document.getElementById('cei-game');
		const canvas = document.getElementById('canvas');

		/* Shell / body toujours plein viewport peint. */
		document.documentElement.style.width = '100%';
		document.documentElement.style.height = '100%';
		document.body.style.width = '100%';
		document.body.style.height = '100%';

		if (!shell) {
			lockLandscape();
			return;
		}
		shell.style.position = 'fixed';
		shell.style.inset = '0';
		shell.style.top = '0';
		shell.style.left = '0';
		shell.style.right = '0';
		shell.style.bottom = '0';
		shell.style.width = '100%';
		shell.style.height = '100%';
		shell.style.margin = '0';
		shell.style.zIndex = '1';
		shell.style.background = '#1a1f1c';
		shell.style.transform = 'none';
		shell.style.overflow = 'hidden';

		/*
		 * Mesurer le shell réel APRÈS full-bleed.
		 * Avant : physH via max(vv/inner/client) < hauteur peinte du shell →
		 * trou noir sous le stage tourné (= « grosse marge bas » en vertical seulement).
		 */
		void shell.offsetWidth;
		const fallback = physicalViewportSize();
		const physW = Math.max(1, shell.clientWidth || Math.round(shell.getBoundingClientRect().width) || fallback.w);
		const physH = Math.max(1, shell.clientHeight || Math.round(shell.getBoundingClientRect().height) || fallback.h);
		const needsRotate = physH > physW;
		const logicW = Math.max(physW, physH);
		const logicH = Math.min(physW, physH);
		window.ceiLandscapeSize = { w: logicW, h: logicH };

		document.documentElement.classList.toggle('cei-portrait', needsRotate);
		document.body.classList.toggle('cei-portrait', needsRotate);

		const box = fitLandscapeGame(logicW, logicH, needsRotate);
		window.ceiLayoutPads = box.pads;
		const ox = Math.round(box.x);
		const oy = Math.round(box.y);
		window.ceiLayoutMeta = {
			needsRotate: needsRotate,
			physW: physW,
			physH: physH,
			ox: ox,
			oy: oy,
			boxX: needsRotate ? 0 : ox,
			boxY: 0,
			gameW: box.w,
			gameH: box.h,
		};
		window.ceiLayoutDebug = {
			physW: physW,
			physH: physH,
			logicW: logicW,
			logicH: logicH,
			needsRotate: needsRotate,
			pads: box.pads,
			safe: readSafeInsets(),
			shell: { w: shell.clientWidth, h: shell.clientHeight },
		};

		if (game) {
			game.style.position = 'absolute';
			game.style.margin = '0';
			game.style.padding = '0';
			game.style.overflow = 'hidden';
			game.style.background = '#1a1f1c';
			game.style.transformOrigin = 'top left';
			game.style.webkitBackfaceVisibility = 'hidden';
			game.style.backfaceVisibility = 'hidden';
			game.style.left = '0';
			game.style.top = '0';
			game.style.right = 'auto';
			game.style.bottom = 'auto';
			game.style.width = box.w + 'px';
			game.style.height = box.h + 'px';

			if (needsRotate) {
				/*
				 * Stage calé sur la boîte réelle du shell (physW×physH).
				 * translate(physW) + rotate(90) : droite logique → bas physique.
				 */
				game.style.transform = 'translate(' + physW + 'px, 0px) rotate(90deg) translate(' + ox + 'px, ' + oy + 'px)';
			} else {
				game.style.left = box.x + 'px';
				game.style.top = '0';
				game.style.transform = 'translateZ(0)';
			}
		}
		sizeGameCanvas(canvas, box.w, box.h);
		lockLandscape();
	}

	function fitViewport() {
		applyForcedLandscapeLayout();
		window.dispatchEvent(new Event('resize'));
	}

	/** Godot peut réécrire canvas.width au boot : on ré-applique le buffer DPR. */
	function enforceCanvasDpr(times, delayMs) {
		let n = 0;
		const tick = function () {
			fitViewport();
			n += 1;
			if (n < times) setTimeout(tick, delayMs);
		};
		tick();
	}

	applyForcedLandscapeLayout();
	fitViewport();
	window.addEventListener('resize', fitViewport);
	window.addEventListener('orientationchange', function () {
		setTimeout(fitViewport, 50);
		setTimeout(fitViewport, 200);
		setTimeout(fitViewport, 500);
	});
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitViewport);
		window.visualViewport.addEventListener('scroll', fitViewport);
	}
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) {
			fitViewport();
		}
	});
	window.addEventListener('click', lockLandscape, { once: true });
	window.addEventListener('touchstart', lockLandscape, { once: true, passive: true });
	try {
		console.info('[CEI] shell', CEI_DEPLOY_ID, 'dpr', canvasDpr());
	} catch (e) {}

	function isStandalone() {
		return window.matchMedia('(display-mode: standalone)').matches
			|| window.navigator.standalone === true;
	}

	function maybeShowMobileTip() {
		const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
		if (!mobile || isStandalone()) return;
		if (localStorage.getItem('cei_hide_mobile_tip') === '1') return;
		tip.style.display = 'block';
		tipBtn.addEventListener('click', () => {
			localStorage.setItem('cei_hide_mobile_tip', '1');
			tip.style.display = 'none';
			lockLandscape();
		});
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			loadDone = true;
			initializing = false;
			try { sessionStorage.removeItem('cei_hard_refresh'); } catch (e) {}
			statusOverlay.remove();
			maybeShowMobileTip();
			fitViewport();
			lockLandscape();
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	async function ceiStartGame() {
		if (await ceiProbeRemoteVersion()) return;
		if (await ceiCheckBuildDrift()) return;
		await ceiReregisterServiceWorker();

		setTimeout(function () {
			if (!loadDone && initializing) {
				ceiHardRefresh('load_watchdog_timeout', CEI_DEPLOY_ID);
			}
		}, LOAD_WATCHDOG_MS);

		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
				setLoadProgress(current, total);
			},
		}).then(() => {
			setStatusMode('hidden');
			/* Ré-applique DPR après init Godot (souvent réécrit canvas.width). */
			enforceCanvasDpr(8, 120);
			ceiReregisterServiceWorker();
			ceiProbeRemoteVersion();
		}, displayFailureNotice);
	}

	if (missing.length !== 0) {
		/*
		 * Ancien chemin Godot : install SW puis reload. On enregistre via CEI
		 * (même URL ?cei=) pour ne pas créer un second scriptURL concurrent.
		 */
		if (GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			ceiReregisterServiceWorker().then(function () {
				reloadGuardThenReload();
			}).catch(function (err) {
				console.error('Error while registering service worker:', err);
				const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
				displayFailureNotice(missingMsg + missing.join('\n'));
			});
			function reloadGuardThenReload() {
				const key = 'cei_cc_' + String(CEI_DEPLOY_ID);
				try {
					if (sessionStorage.getItem(key) === '1') {
						const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
						displayFailureNotice(missingMsg + missing.join('\n'));
						return;
					}
					sessionStorage.setItem(key, '1');
				} catch (e0) {}
				window.location.reload();
			}
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		ceiStartGame();
	}
}());
		</script>
	</body>
</html>
