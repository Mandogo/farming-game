<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="theme-color" content="#85a87a">
		<title>Crop Express Idle</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	height: 100dvh;
	overflow: hidden;
	position: fixed;
	inset: 0;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	background-color: #85a87a;
	color: white;
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	outline: none;
}

#canvas:focus {
	outline: none;
}

/* Probe invisible pour lire env(safe-area-inset-*) depuis Godot */
#cei-safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding-left: env(safe-area-inset-left, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-top: env(safe-area-inset-top, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#mobile-tip {
	display: none;
	position: fixed;
	left: 50%;
	bottom: max(12px, env(safe-area-inset-bottom, 0px));
	transform: translateX(-50%);
	z-index: 20;
	max-width: min(92vw, 420px);
	padding: 10px 14px;
	border-radius: 12px;
	background: rgba(20, 28, 22, 0.88);
	color: #f2f5ef;
	font: 600 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif;
	text-align: center;
	box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
	pointer-events: auto;
}

#mobile-tip button {
	margin-top: 8px;
	border: 0;
	border-radius: 8px;
	padding: 8px 12px;
	background: #6f9a5e;
	color: #fff;
	font: 700 13px/1 system-ui, sans-serif;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="crops_express_idle.icon.png" />
<link rel="apple-touch-icon" href="crops_express_idle.apple-touch-icon.png"/>
<link rel="manifest" href="crops_express_idle.manifest.json">

	</head>
	<body>
		<div id="cei-safe-probe" aria-hidden="true"></div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="crops_express_idle.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="mobile-tip" role="dialog" aria-live="polite">
			Pour un vrai plein écran (sans barre d’URL) : ajoute le jeu à l’écran d’accueil.
			<button type="button" id="mobile-tip-dismiss">OK</button>
		</div>

		<script src="crops_express_idle.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"crops_express_idle","experimentalVK":false,"fileSizes":{"crops_express_idle.pck":10431752,"crops_express_idle.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"crops_express_idle.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

/** Insets notch / Dynamic Island (px CSS). 0 sur écrans sans découpe. */
window.ceiSafeInsets = function () {
	const probe = document.getElementById('cei-safe-probe');
	const s = probe ? getComputedStyle(probe) : null;
	const vv = window.visualViewport;
	return {
		l: s ? (parseFloat(s.paddingLeft) || 0) : 0,
		t: s ? (parseFloat(s.paddingTop) || 0) : 0,
		r: s ? (parseFloat(s.paddingRight) || 0) : 0,
		b: s ? (parseFloat(s.paddingBottom) || 0) : 0,
		w: (vv && vv.width) || window.innerWidth || 1,
		h: (vv && vv.height) || window.innerHeight || 1,
	};
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const tip = document.getElementById('mobile-tip');
	const tipBtn = document.getElementById('mobile-tip-dismiss');

	let initializing = true;
	let statusMode = '';

	function fitViewport() {
		const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
		const w = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
		document.documentElement.style.height = h + 'px';
		document.body.style.height = h + 'px';
		document.documentElement.style.width = w + 'px';
		document.body.style.width = w + 'px';
		window.dispatchEvent(new Event('resize'));
	}

	fitViewport();
	window.addEventListener('resize', fitViewport);
	window.addEventListener('orientationchange', () => setTimeout(fitViewport, 120));
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitViewport);
		window.visualViewport.addEventListener('scroll', fitViewport);
	}

	function isStandalone() {
		return window.matchMedia('(display-mode: standalone)').matches
			|| window.navigator.standalone === true;
	}

	function maybeShowMobileTip() {
		const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
		if (!mobile || isStandalone()) return;
		if (localStorage.getItem('cei_hide_mobile_tip') === '1') return;
		tip.style.display = 'block';
		tipBtn.addEventListener('click', () => {
			localStorage.setItem('cei_hide_mobile_tip', '1');
			tip.style.display = 'none';
		});
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			maybeShowMobileTip();
			fitViewport();
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
