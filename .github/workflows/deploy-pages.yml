name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web_export/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Prérequis (1 fois) : Settings → Pages → Build and deployment → Source = "GitHub Actions"
# Sans ça, configure-pages échoue avec "Get Pages site failed / Not Found".

permissions:
  contents: read
  pages: write
  id-token: write

# Ne PAS annuler un déploiement en cours : la file GitHub Pages met souvent
# 10–20+ min ; cancel-in-progress:true provoquait "Deployment cancelled" / reruns.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare site from web_export/
        run: |
          set -euo pipefail
          mkdir -p _site
          find web_export -maxdepth 1 -type f ! -name '*.import' -exec cp -t _site {} +
          ## Toujours aligner index.html sur l'export Godot (évite une vieille PWA sur mobile).
          if [ -f _site/crops_express_idle.html ]; then
            cp -f _site/crops_express_idle.html _site/index.html
          fi
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then
            echo "::error::web_export/index.html manquant — exporte le jeu Web dans web_export/ puis push."
            exit 1
          fi
          ls -lah _site
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # Timeout défaut = 10 min ; la file Pages dépasse souvent ça → faux échec.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
