name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web_export/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Prérequis (1 fois) : Settings → Pages → Build and deployment → Source = "GitHub Actions"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  deployments: write

# Un run bloqué (job deploy « queued » sans runner) ne doit pas geler toute la file.
# true = un nouveau push/workflow_dispatch annule le run coincé du groupe `pages`.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site from web_export/
        run: |
          set -euo pipefail
          mkdir -p _site
          find web_export -maxdepth 1 -type f ! -name '*.import' -exec cp -t _site {} +
          if [ -f _site/crops_express_idle.html ]; then
            cp -f _site/crops_express_idle.html _site/index.html
          fi
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then
            echo "::error::web_export/index.html manquant — exporte le jeu Web dans web_export/ puis push."
            exit 1
          fi
          ls -lah _site
          du -sh _site

      # Re-run = nouvel artefact du même nom → « Artifact count is 2 ».
      - name: Delete stale github-pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              if (String(artifact.name).startsWith('github-pages')) {
                core.info(`Deleting stale artifact ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      pages: write
      id-token: write
      actions: read
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4 plafonne à 10 min puis ANNULE le déploiement Pages
      # (souvent encore en deployment_queued). On crée le déploiement OIDC nous-mêmes
      # et on poll jusqu'à 45 min, avec cancel des déploiements Pages orphelins.
      - name: Deploy to GitHub Pages (long poll)
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_BUILD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::error::artifact_id manquant (upload Pages)"
            exit 1
          fi
          echo "Using artifact_id=${ARTIFACT_ID}"

          cancel_pages_deployment() {
            local id="$1"
            [ -n "$id" ] || return 0
            echo "Cancel Pages deployment ${id}…"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${id}/cancel" >/dev/null 2>&1 \
              && echo "canceled ${id}" \
              || echo "cancel ${id} ignored (déjà terminé / introuvable)"
          }

          echo "::group::Release stale environment deployments (no status)"
          # Un déploiement d'environnement sans statut peut bloquer le job deploy en « queued ».
          mapfile -t DEP_IDS < <(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=15" \
            --jq '.[].id')
          for dep_id in "${DEP_IDS[@]:-}"; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}/statuses" --jq 'length' 2>/dev/null || echo 0)"
            if [ "${count}" = "0" ]; then
              echo "Deleting empty-status deployment ${dep_id}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}" >/dev/null 2>&1 \
                || echo "delete ${dep_id} ignored"
            fi
          done
          echo "::endgroup::"

          echo "::group::OIDC token"
          AUDIENCE_ENC="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://github.com/actions/deploy-pages", safe=""))')"
          OID_JSON="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE_ENC}")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OID_JSON")"
          test -n "$OIDC_TOKEN"
          echo "::endgroup::"

          create_deployment() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input - <<EOF
          {
            "artifact_id": ${ARTIFACT_ID},
            "pages_build_version": "${PAGES_BUILD_VERSION}",
            "oidc_token": "${OIDC_TOKEN}"
          }
          EOF
          }

          echo "::group::Create Pages deployment"
          CREATE_JSON=""
          CREATE_ERR=""
          for attempt in 1 2 3; do
            set +e
            CREATE_JSON="$(create_deployment 2> /tmp/pages-create.err)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ -n "$CREATE_JSON" ]; then
              break
            fi
            CREATE_ERR="$(cat /tmp/pages-create.err 2>/dev/null || true)"
            echo "create attempt ${attempt} failed: ${CREATE_ERR}"
            # "due to in progress deployment. Please cancel <sha> first"
            BLOCKING="$(python3 -c 'import re,sys; t=sys.argv[1]; m=re.search(r"cancel\s+([0-9a-f]{7,40})\s+first", t, re.I); print(m.group(1) if m else "")' "${CREATE_ERR}")"
            if [ -n "$BLOCKING" ]; then
              cancel_pages_deployment "$BLOCKING"
              sleep 5
              continue
            fi
            # Aussi tenter d'annuler notre sha courant (re-run / orphelin)
            cancel_pages_deployment "${PAGES_BUILD_VERSION}"
            sleep 8
          done
          if [ -z "$CREATE_JSON" ]; then
            echo "::error::Impossible de créer le déploiement Pages"
            echo "${CREATE_ERR}"
            exit 1
          fi
          echo "$CREATE_JSON"
          DEPLOY_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["id"])' <<<"$CREATE_JSON")"
          PAGE_URL="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("page_url") or "")' <<<"$CREATE_JSON")"
          echo "deployment_id=${DEPLOY_ID}"
          if [ -z "$PAGE_URL" ]; then
            PAGE_URL="https://mandogo.github.io/farming-game/"
          fi
          echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Poll status (max 45 min)"
          DEADLINE=$((SECONDS + 2700))
          LAST=""
          STUCK_TICKS=0
          RECREATED=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${DEPLOY_ID}")"
            STATE="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("status") or d.get("state") or "unknown").lower())' <<<"$STATUS_JSON")"
            if [ "$STATE" != "$LAST" ]; then
              echo "status=${STATE}"
              LAST="$STATE"
              STUCK_TICKS=0
            else
              STUCK_TICKS=$((STUCK_TICKS + 1))
            fi
            case "$STATE" in
              succeed|success|deployed|built)
                echo "Deploy Pages OK → ${PAGE_URL}"
                exit 0
                ;;
              fail|failure|failed|error|cancelled|canceled)
                echo "::error::Pages deployment status=${STATE}"
                echo "$STATUS_JSON"
                exit 1
                ;;
            esac
            # Si deployment_queued reste figé ~12 min, cancel + recreate une fois
            if [ "$STATE" = "deployment_queued" ] && [ "$STUCK_TICKS" -ge 48 ] && [ "${RECREATED:-0}" != "1" ]; then
              echo "::warning::deployment_queued figé ~12 min — cancel + recreate"
              cancel_pages_deployment "${DEPLOY_ID}"
              sleep 5
              CREATE_JSON="$(create_deployment)"
              DEPLOY_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["id"])' <<<"$CREATE_JSON")"
              echo "recreated deployment_id=${DEPLOY_ID}"
              RECREATED=1
              LAST=""
              STUCK_TICKS=0
            fi
            sleep 15
          done
          echo "::error::Timeout 45 min (last status=${LAST:-unknown}). Le site peut encore se publier côté GitHub Pages."
          exit 1
