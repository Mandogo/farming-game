name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web_export/**"
      - "tools/patch_web_sw.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Patch PWA service worker + stamp deploy id
        run: |
          set -euo pipefail
          python3 tools/patch_web_sw.py
          # Garantit index = HTML principal (même SW / même CEI_DEPLOY_ID)
          cp -f web_export/crops_express_idle.html web_export/index.html
          grep -q "skipWaiting" web_export/crops_express_idle.service.worker.js
          grep -q "CEI_DEPLOY_ID" web_export/crops_express_idle.html
          grep -q "cei-version.json" web_export/crops_express_idle.service.worker.js
          test -f web_export/cei-version.json
          grep -q "deploy_id" web_export/cei-version.json
          echo "PWA patch OK"

      - name: Prepare site from web_export/
        run: |
          set -euo pipefail
          mkdir -p _site
          find web_export -maxdepth 1 -type f ! -name '*.import' -exec cp -t _site {} +
          if [ -f _site/crops_express_idle.html ]; then
            cp -f _site/crops_express_idle.html _site/index.html
          fi
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then
            echo "::error::web_export/index.html manquant"
            exit 1
          fi
          # Aide au debug deploy : id visible dans les logs
          grep -o "CEI_DEPLOY_ID = '[^']*'" _site/index.html || true
          grep -o "CACHE_VERSION = '[^']*'" _site/crops_express_idle.service.worker.js || true
          ls -lah _site
          du -sh _site

      - name: Delete stale github-pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              if (String(artifact.name).startsWith('github-pages')) {
                core.info(`Deleting stale artifact ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Prefer official action (handles OIDC). Unique artifact_name → Re-run OK.
      # Si timeout 10 min (plafond GitHub) : on retente 1 fois sans ré-uploader.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
          reporting_interval: 10000

      - name: Retry deploy once if first attempt failed
        id: deployment_retry
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
          reporting_interval: 10000
