name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web_export/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site from web_export/
        run: |
          set -euo pipefail
          mkdir -p _site
          find web_export -maxdepth 1 -type f ! -name '*.import' -exec cp -t _site {} +
          if [ -f _site/crops_express_idle.html ] && [ ! -f _site/index.html ]; then
            cp _site/crops_express_idle.html _site/index.html
          fi
          touch _site/.nojekyll
          if [ ! -f _site/index.html ]; then
            echo "::error::web_export/index.html manquant — exporte le jeu Web dans web_export/ puis push."
            exit 1
          fi
          ls -lah _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
