name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web_export/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -euo pipefail
          if [ ! -f web_export/crops_express_idle.html ]; then
            echo "::error::web_export/ manquant ou incomplet. Exporte le jeu Web depuis Godot puis commit ce dossier."
            exit 1
          fi
          mkdir -p _site
          # Copie l’export (sans artefacts .import Godot)
          find web_export -maxdepth 1 -type f ! -name '*.import' -exec cp -t _site {} +
          # URL racine propre : / → index.html
          cp _site/crops_express_idle.html _site/index.html
          # Empêche Jekyll d’ignorer certains fichiers
          touch _site/.nojekyll
          ls -lah _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
